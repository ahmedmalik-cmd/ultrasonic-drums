name: compile

on:
  push:
  pull_request:

jobs:
  compile:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        fqbn: ["arduino:avr:leonardo", "arduino:avr:micro"]
    steps:
      - uses: actions/checkout@v5
      - uses: arduino/compile-sketches@v1
        with:
          fqbn: ${{ matrix.fqbn }}
          libraries: |
            - name: MIDIUSB
          sketch-paths: |
            - ultrasonic_drums
